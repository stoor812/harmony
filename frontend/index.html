<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Harmony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Decorative background waves -->
  <div class="waves-bg" aria-hidden="true">
    <svg class="wave wave-1" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C180,10 360,110 540,60 C720,10 900,110 1080,60 C1260,10 1440,110 1440,60 L1440,120 L0,120 Z"/>
      <path d="M0,60 C180,10 360,110 540,60 C720,10 900,110 1080,60 C1260,10 1440,110 1440,60 L1440,120 L0,120 Z" transform="translate(1440,0)"/>
    </svg>
    <svg class="wave wave-2" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,70 C240,20 480,120 720,70 C960,20 1200,120 1440,70 L1440,120 L0,120 Z"/>
      <path d="M0,70 C240,20 480,120 720,70 C960,20 1200,120 1440,70 L1440,120 L0,120 Z" transform="translate(1440,0)"/>
    </svg>
    <svg class="wave wave-3" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,50 C120,5 240,95 360,50 C480,5 600,95 720,50 C840,5 960,95 1080,50 C1200,5 1320,95 1440,50 L1440,120 L0,120 Z"/>
      <path d="M0,50 C120,5 240,95 360,50 C480,5 600,95 720,50 C840,5 960,95 1080,50 C1200,5 1320,95 1440,50 L1440,120 L0,120 Z" transform="translate(1440,0)"/>
    </svg>
  </div>

  <div class="app">

    <!-- Left panel: player -->
    <div class="player-panel">

      <div class="brand">harmony</div>

      <!-- Album art with animated ring -->
      <div class="album-art-wrap">
        <div class="album-ring" id="album-ring"></div>
        <img id="album-art" src="https://via.placeholder.com/210x210/1a1a2e/ffffff?text=%E2%99%AA"
             alt="No track loaded" loading="lazy"/>
      </div>

      <!-- Track info -->
      <div class="track-info">
        <div id="track-title"  class="track-title">No Track Loaded</div>
        <div id="track-artist" class="track-artist">—</div>
        <div id="track-album"  class="track-album">—</div>
      </div>

      <!-- Progress bar -->
      <div class="progress-wrap">
        <span id="time-current" class="time">0:00</span>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="time-total" class="time">0:30</span>
      </div>

      <!-- Controls -->
      <div class="controls">

        <button id="btn-stop" class="ctrl-btn" onclick="sendCommand('stop')" title="Stop" aria-label="Stop">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/>
          </svg>
        </button>

        <button id="btn-play" class="ctrl-btn primary" onclick="handlePlayPause()" title="Play / Pause" aria-label="Play">
          <svg id="icon-play" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="6,4 20,12 6,20" fill="currentColor"/>
          </svg>
          <svg id="icon-pause" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
            <rect x="6"  y="4" width="4" height="16" rx="1" fill="currentColor"/>
            <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
          </svg>
        </button>

        <button id="btn-skip" class="ctrl-btn" onclick="sendCommand('skip')" title="Skip" aria-label="Skip to next">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="5,4 15,12 5,20" fill="currentColor"/>
            <rect x="17" y="4" width="3" height="16" rx="1" fill="currentColor"/>
          </svg>
        </button>

      </div>

      <!-- Volume -->
      <div class="volume-wrap">
        <span class="vol-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor"/>
          </svg>
        </span>
        <input type="range" id="volume-slider" min="0" max="100" value="75"
               aria-label="Volume" oninput="setVolume(this.value)" />
        <span class="vol-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span id="vol-label" class="vol-label">75</span>
      </div>

      <!-- Hidden audio element -->
      <audio id="audio-player" preload="none"></audio>
    </div>

    <!-- Right panel: info + search -->
    <div class="info-panel">

      <!-- State indicator -->
      <div class="section">
        <div class="section-title">Daemon State</div>
        <div class="state-row">
          <div id="state-dot" class="state-dot grey" role="status" aria-live="polite"></div>
          <span id="state-label" class="state-label">IDLE</span>
        </div>
        <div id="last-transition" class="last-transition">—</div>
      </div>

      <!-- State machine visualizer -->
      <div class="section">
        <div class="section-title">State Machine</div>
        <div class="fsm-wrap" role="img" aria-label="Finite state machine diagram">
          <div id="fsm-IDLE"      class="fsm-node active">IDLE</div>
          <div class="fsm-arrow">→</div>
          <div id="fsm-BUFFERING" class="fsm-node">BUF</div>
          <div class="fsm-arrow">→</div>
          <div id="fsm-PLAYING"   class="fsm-node">PLAY</div>
          <div class="fsm-arrow">⇄</div>
          <div id="fsm-PAUSED"    class="fsm-node">PAUSE</div>
          <div class="fsm-arrow">→</div>
          <div id="fsm-STOPPED"   class="fsm-node">STOP</div>
        </div>
      </div>

      <!-- Up Next queue -->
      <div class="section">
        <div class="section-title">Up Next</div>
        <div id="up-next-list" class="up-next-list">
          <div class="up-next-empty">Queue empty</div>
        </div>
      </div>

      <!-- Search -->
      <div class="section">
        <div class="section-title">Search iTunes</div>
        <div class="search-row">
          <input type="text" id="search-input" placeholder="Search for a song…"
                 aria-label="Search iTunes"
                 onkeydown="if(event.key==='Enter') doSearch()" />
          <button onclick="doSearch()" aria-label="Search">Search</button>
        </div>
        <div id="search-results" class="search-results" role="list"></div>
      </div>

      <!-- Fault injection -->
      <div class="section">
        <div class="section-title">Fault Injection</div>
        <div class="fault-buttons">
          <div class="fault-item">
            <button id="btn-api-failure" class="fault-btn" onclick="simulateApiFailure()">Toggle API Failure</button>
            <div id="msg-api-failure" class="fault-msg"></div>
          </div>
        </div>
      </div>

      <!-- Health -->
      <div class="section">
        <div class="section-title">Daemon Health</div>
        <div id="health-info" class="health-grid">
          <span class="health-key">status</span><span class="health-val">loading…</span>
        </div>
      </div>

    </div>
  </div>

  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>
  <script src="app.js"></script>
</body>
</html>
