<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Harmony</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Left panel: player -->
    <div class="player-panel">

      <div class="brand">harmony</div>

      <!-- Album art -->
      <div class="album-art-wrap">
        <img id="album-art" src="https://via.placeholder.com/220x220/1a1a2e/ffffff?text=♪" alt="Album Art"/>
      </div>

      <!-- Track info -->
      <div class="track-info">
        <div id="track-title" class="track-title">No Track Loaded</div>
        <div id="track-artist" class="track-artist">—</div>
        <div id="track-album" class="track-album">—</div>
      </div>

      <!-- Progress bar -->
      <div class="progress-wrap">
        <span id="time-current" class="time">0:00</span>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="time-total" class="time">0:30</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="btn-stop" class="ctrl-btn" onclick="sendCommand('stop')" title="Stop">⏹</button>
        <button id="btn-play" class="ctrl-btn primary" onclick="handlePlayPause()" title="Play/Pause">▶</button>
        <button id="btn-skip" class="ctrl-btn" onclick="sendCommand('skip')" title="Skip">⏭</button>
      </div>

      <!-- Volume -->
      <div class="volume-wrap">
        <span class="vol-icon">🔈</span>
        <input type="range" id="volume-slider" min="0" max="100" value="75"
               oninput="setVolume(this.value)" />
        <span class="vol-icon">🔊</span>
        <span id="vol-label" class="vol-label">75</span>
      </div>

      <!-- Hidden audio element - plays iTunes 30s previews -->
      <audio id="audio-player" preload="none"></audio>
    </div>

    <!-- Right panel: info + search -->
    <div class="info-panel">

      <!-- State indicator -->
      <div class="section">
        <div class="section-title">Daemon State</div>
        <div class="state-row">
          <div id="state-dot" class="state-dot grey"></div>
          <span id="state-label" class="state-label">IDLE</span>
        </div>
        <div id="last-transition" class="last-transition">—</div>
      </div>

      <!-- State machine visualizer -->
      <div class="section">
        <div class="section-title">State Machine</div>
        <div class="fsm-wrap">
          <div id="fsm-IDLE"      class="fsm-node active">IDLE</div>
          <div class="fsm-arrow">→</div>
          <div id="fsm-BUFFERING" class="fsm-node">BUF</div>
          <div class="fsm-arrow">→</div>
          <div id="fsm-PLAYING"   class="fsm-node">PLAY</div>
          <div class="fsm-arrow">⇄</div>
          <div id="fsm-PAUSED"    class="fsm-node">PAUSE</div>
          <div class="fsm-arrow">→</div>
          <div id="fsm-STOPPED"   class="fsm-node">STOP</div>
        </div>
      </div>

      <!-- Up Next queue -->
      <div class="section">
        <div class="section-title">Up Next</div>
        <div id="up-next-list" class="up-next-list">
          <div class="up-next-empty">Queue empty</div>
        </div>
      </div>

      <!-- Search -->
      <div class="section">
        <div class="section-title">Search iTunes</div>
        <div class="search-row">
          <input type="text" id="search-input" placeholder="Search for a song..."
                 onkeydown="if(event.key==='Enter') doSearch()" />
          <button onclick="doSearch()">Search</button>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>

      <!-- Fault injection -->
      <div class="section">
        <div class="section-title">Fault Injection</div>
        <div class="fault-buttons">
          <div class="fault-item">
            <button id="btn-api-failure" class="fault-btn" onclick="simulateApiFailure()">Toggle API Failure</button>
            <div id="msg-api-failure" class="fault-msg"></div>
          </div>
        </div>
      </div>

      <!-- Health -->
      <div class="section">
        <div class="section-title">Daemon Health</div>
        <div id="health-info" class="health-info">Loading...</div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
